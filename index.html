  var initSignal = function () {
/* Signal strip: scattered records settle into a chart */
  (function () {

    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    }
    function rnd(a, b) { return a + Math.random() * (b - a); }
    function ease(t) { t = Math.max(0, Math.min(1, t)); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

    function build() {
      var r = cv.getBoundingClientRect();
      W = Math.max(280, r.width); H = r.height;
      dpr = Math.min(window.devicePixelRatio || 1, 2);

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      var slot = (W - 2 * padX) / BARS.length, bw = slot * 0.62;
      var sum = BARS.reduce(function (a, b) { return a + b; }, 0);
      geo = { padX: padX, base: base, slot: slot, bw: bw, tops: [] };
      P = [];
      BARS.forEach(function (h, b) {
        var cnt = Math.max(5, Math.round(n * h / sum));
        var bh = (base - top) * h, bx = padX + b * slot + (slot - bw) / 2;
        geo.tops.push({ x: bx + bw / 2, y: base - bh });
        for (var i = 0; i < cnt; i++) {
          P.push({
            tx: bx + rnd(2, bw - 2), ty: base - rnd(2, bh),
