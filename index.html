<style>
  /* Layout concept: an Accra-rooted analyst's studio. A woven kente-style band frames the page, an arch portrait leads the hero, and one animated canvas shows scattered data resolving into a chart. */
  :root {
    --bg: #F3F5F1;
    --surface: #FFFFFF;
    --panel: #0F2A23;

    --ink: #10201B;

      --surface: #11231D;

      --ink: #EAF2EE;
      --muted: #9DB6AD;
      --line: #25423A;
      --tint: #14291F;
      --brand: #4FD1A5;
      --on-brand: #06231A;
      --gold: #F5BC3A;
      --on-gold: #1A1405;
      --clay: #FF7B5C;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0A1512;
    --surface: #11231D;
    --panel: #15332A;
    --on-panel: #EEF4F0;
    --ink: #EAF2EE;
    --muted: #9DB6AD;
    --line: #25423A;
    --tint: #14291F;
    --brand: #4FD1A5;
    --on-brand: #06231A;
    --gold: #F5BC3A;
    --on-gold: #1A1405;
    --clay: #FF7B5C;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 5rem; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 1.0625rem;
    line-height: 1.65;
    padding-inline: 1.25rem;
    padding-block: 0;
    overflow-x: clip;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 72rem; margin-inline: auto; }
  h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.12; letter-spacing: -0.03em; }
  p { margin: 0; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 4px; }
  .label { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

  /* Woven band, a nod to kente cloth */
  .kente {
    height: 1.1rem;
    background:
      repeating-linear-gradient(90deg, var(--gold) 0 1.5rem, var(--brand) 1.5rem 3rem, var(--clay) 3rem 3.75rem, var(--ink) 3.75rem 4.5rem, var(--gold) 4.5rem 4.75rem, var(--brand) 4.75rem 6rem) top / 100% 50% no-repeat,
      repeating-linear-gradient(90deg, var(--clay) 0 1.1rem, var(--gold) 1.1rem 2.2rem, var(--ink) 2.2rem 2.5rem, var(--brand) 2.5rem 4.5rem, var(--gold) 4.5rem 5.2rem, var(--clay) 5.2rem 6rem) bottom / 100% 50% no-repeat;
  }
  .kente.thin { height: 0.6rem; border-radius: 0.3rem; }

  /* Top bar */
  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); margin-inline: -1.25rem; padding-inline: 1.25rem; border-bottom: 1px solid var(--line); }
  .bar-in { max-width: 72rem; margin-inline: auto; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-block: 0.7rem; }
  .mark { font-family: var(--font-display); font-weight: 900; font-size: 0.95rem; text-decoration: none; letter-spacing: -0.02em; white-space: nowrap; display: inline-flex; align-items: center; gap: 0.55rem; }
  .mark i { width: 1.9rem; height: 1.9rem; border-radius: 50%; background: var(--gold); color: var(--on-gold); display: grid; place-items: center; font-style: normal; font-size: 0.8rem; }
  nav { display: flex; gap: 1.4rem; align-items: center; }
  nav a.l { font-size: 0.9rem; font-weight: 500; color: var(--muted); text-decoration: none; padding-block: 0.2rem; border-bottom: 2px solid transparent; }
  nav a.l:hover { color: var(--ink); border-bottom-color: var(--gold); }
  .tools { display: flex; gap: 0.6rem; align-items: center; }
  .icon-btn { width: 2.4rem; height: 2.4rem; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
  .icon-btn:hover { border-color: var(--gold); }
  .pill { font-weight: 600; font-size: 0.875rem; background: var(--ink); color: var(--bg); padding: 0.55rem 1rem; border-radius: 999px; text-decoration: none; white-space: nowrap; }
  .pill:hover { background: var(--brand); color: var(--on-brand); }
  @media (max-width: 68rem) { nav a.l { display: none; } }
  @media (max-width: 30rem) {
    .bar-in { gap: 0.5rem; }
    .mark { font-size: 0.8rem; gap: 0.4rem; }
    .mark i { width: 1.6rem; height: 1.6rem; font-size: 0.7rem; }
    .tools { gap: 0.4rem; }
    .icon-btn { width: 2.1rem; height: 2.1rem; }
    .pill { padding: 0.5rem 0.8rem; font-size: 0.8rem; }
  }

  /* Buttons */
  .btn { font: inherit; font-weight: 600; font-size: 0.97rem; display: inline-flex; align-items: center; gap: 0.6rem; padding: 0.9rem 1.5rem; border-radius: 999px; cursor: pointer; text-decoration: none; border: 2px solid transparent; transition: transform 0.2s ease, background 0.2s ease; }
  .btn:hover { transform: translateY(-2px); }
  .btn-gold { background: var(--gold); color: var(--on-gold); }
  .btn-ghost { border-color: var(--ink); color: var(--ink); background: transparent; }
  .btn-ghost:hover { background: var(--ink); color: var(--bg); }
  .btn svg { width: 1.1rem; height: 1.1rem; }

  /* Hero */
  .hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr); gap: clamp(2rem, 5vw, 4.5rem); align-items: center; padding-block: clamp(2.5rem, 6vw, 5rem) 3rem; }
  .eyebrow { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.9rem; }
  .dot { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 0.3rem color-mix(in srgb, var(--brand) 22%, transparent); }
  .hero h1 { margin-top: 1.4rem; font-size: clamp(2.1rem, 0.9rem + 5.2vw, 4.6rem); font-weight: 900; line-height: 1.02; letter-spacing: -0.045em; }
  .hl { background: linear-gradient(var(--gold), var(--gold)) 0 88% / 0% 0.32em no-repeat; animation: sweep 1.1s 0.5s ease forwards; padding-bottom: 0.05em; }
  @keyframes sweep { to { background-size: 100% 0.32em; } }
  .lede { margin-top: 1.6rem; max-width: 36rem; font-size: 1.15rem; color: var(--muted); }
  .cta { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 2rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .chip { font-family: var(--font-mono); font-size: 0.78rem; padding: 0.3rem 0.7rem; border-radius: 999px; background: var(--tint); border: 1px solid var(--line); }
  .hero .chips { margin-top: 2rem; }

  .portrait { position: relative; justify-self: center; width: 100%; max-width: 24rem; padding: 0 0 1.4rem 1.4rem; }
  .arch { position: relative; aspect-ratio: 4 / 5; border-radius: 999px 999px 1.4rem 1.4rem; overflow: hidden; background: var(--tint); border: 3px solid var(--ink); z-index: 1; }
  .arch img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .portrait::before { content: ""; position: absolute; inset: 1.4rem 0 0 0; border-radius: 999px 999px 1.4rem 1.4rem; background: var(--gold); z-index: 0; }
  .ring { position: absolute; left: -1.2rem; bottom: -0.4rem; width: 8.2rem; height: 8.2rem; z-index: 2; }
  .ring .disc { position: absolute; inset: 0; border-radius: 50%; background: var(--ink); }
  .ring svg { position: absolute; inset: 0; width: 100%; height: 100%; animation: spin 26s linear infinite; }
  .ring text { fill: var(--bg); font-family: var(--font-mono); font-size: 8.2px; text-transform: uppercase; }
  .ring .core { position: absolute; inset: 2.55rem; border-radius: 50%; background: var(--gold); color: var(--on-gold); display: grid; place-items: center; }
  .ring .core svg { position: static; width: 1.5rem; height: 1.5rem; animation: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 52rem) { .hero { grid-template-columns: minmax(0, 1fr); } .portrait { order: -1; max-width: 18rem; } .ring { width: 6.6rem; height: 6.6rem; } .ring .core { inset: 2rem; } }

  /* Signal strip: data resolving into insight */
  .signal { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 1.4rem; overflow: hidden; }
  .signal canvas { display: block; width: 100%; height: 15rem; }
  .signal .tl, .signal .tr { position: absolute; top: 0.9rem; }
  .signal .tl { left: 1.2rem; } .signal .tr { right: 1.2rem; }
  .signal .bl { position: absolute; left: 1.2rem; bottom: 0.8rem; font-size: 0.68rem; }
  @media (max-width: 40rem) { .signal canvas { height: 12rem; } }

  /* Tool ticker */
  .ticker { margin-top: 2.2rem; overflow: hidden; border-block: 1px solid var(--line); padding-block: 0.9rem; mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
  .track { display: flex; width: max-content; animation: slide 36s linear infinite; }
  .ticker:hover .track { animation-play-state: paused; }
  .track span { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; letter-spacing: -0.02em; white-space: nowrap; padding-inline: 1.4rem; display: inline-flex; align-items: center; gap: 2.8rem; }
  .track span::after { content: ""; width: 0.55rem; height: 0.55rem; background: var(--gold); transform: rotate(45deg); flex: none; }
  @keyframes slide { to { transform: translateX(-50%); } }

  /* Sections */
  section { padding-block: clamp(3.5rem, 8vw, 6rem) 0; }
  .sec-head { display: grid; gap: 0.9rem; margin-bottom: 2.4rem; max-width: 44rem; }
  .sec-head h2 { font-size: clamp(1.7rem, 1rem + 2.8vw, 2.9rem); font-weight: 900; }
  .sec-head p { color: var(--muted); font-size: 1.08rem; }

  /* Services */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap: 1rem; }
  .card { position: relative; background: var(--surface); border: 1.5px solid var(--line); border-radius: 1.2rem; padding: 1.6rem; min-width: 0; display: grid; gap: 0.9rem; align-content: start; transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease; }
  .card:hover { transform: translateY(-5px); border-color: var(--ink); box-shadow: 0.35rem 0.35rem 0 var(--gold); }
  .card .ic { width: 3rem; height: 3rem; border-radius: 0.9rem; display: grid; place-items: center; background: var(--tint); color: var(--brand); }
  .card:nth-child(2) .ic { background: color-mix(in srgb, var(--gold) 30%, var(--surface)); color: var(--ink); }
  .card:nth-child(3) .ic { background: color-mix(in srgb, var(--clay) 18%, var(--surface)); color: var(--clay); }
  .card .ic svg { width: 1.5rem; height: 1.5rem; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .card h3 { font-size: 1.15rem; font-weight: 700; }
  .card p { color: var(--muted); font-size: 0.99rem; }

  /* Work */
  .work { display: grid; gap: 1.25rem; }
  .case { border-radius: 1.6rem; overflow: hidden; border: 1.5px solid var(--line); background: var(--surface); }
  .case.feature { background: var(--panel); color: var(--on-panel); border-color: transparent; }
  .case-in { padding: clamp(1.4rem, 4vw, 2.8rem); display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: clamp(1.5rem, 4vw, 3.5rem); }
  .case h3 { font-size: clamp(1.4rem, 1rem + 1.6vw, 2.1rem); font-weight: 900; margin-top: 0.9rem; }
  .case .meta { margin-top: 1rem; opacity: 0.8; }
  .case .tag { font-family: var(--font-mono); font-size: 0.74rem; letter-spacing: 0.1em; text-transform: uppercase; display: inline-block; padding: 0.3rem 0.75rem; border-radius: 999px; background: var(--gold); color: var(--on-gold); font-weight: 500; }
  .case.alt .tag { background: var(--tint); color: var(--ink); border: 1px solid var(--line); }
  .case ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 1.1rem; align-content: center; }
  .case li { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); gap: 0.6rem; }
  .case li svg { width: 1.3rem; height: 1.3rem; margin-top: 0.25rem; fill: none; stroke: var(--gold); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .case.alt li svg { stroke: var(--brand); }
  .case .chips { margin-top: 1.5rem; }
  .case.feature .chip { background: color-mix(in srgb, var(--on-panel) 10%, transparent); border-color: color-mix(in srgb, var(--on-panel) 22%, transparent); color: var(--on-panel); }
  @media (max-width: 52rem) { .case-in { grid-template-columns: minmax(0, 1fr); } }

  /* Journey */
  .journey { list-style: none; margin: 0; padding: 0 0 0 1.9rem; position: relative; display: grid; gap: 2.2rem; }
  .journey::before { content: ""; position: absolute; left: 0.45rem; top: 0.5rem; bottom: 0.5rem; width: 3px; background: linear-gradient(var(--gold), var(--brand), var(--clay)); border-radius: 2px; }
  .journey li { position: relative; display: grid; grid-template-columns: 10rem minmax(0, 1fr); gap: 0.5rem 2rem; }
  .journey li::before { content: ""; position: absolute; left: -1.9rem; top: 0.45rem; width: 1rem; height: 1rem; border-radius: 50%; background: var(--bg); border: 3px solid var(--ink); }
  .journey .when { font-family: var(--font-mono); font-size: 0.9rem; color: var(--muted); padding-top: 0.2rem; }
  .journey h3 { font-size: 1.25rem; font-weight: 700; }
  .journey p { color: var(--muted); margin-top: 0.3rem; }
  @media (max-width: 40rem) { .journey li { grid-template-columns: minmax(0, 1fr); } }

  /* Toolkit */
  .kit { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: 1rem; }
  .kit > div { background: var(--surface); border: 1.5px solid var(--line); border-radius: 1.2rem; padding: 1.4rem; min-width: 0; }
  .kit h3 { font-family: var(--font-body); font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 1rem; }
  .kit .chip { font-family: var(--font-display); font-weight: 700; font-size: 1rem; letter-spacing: -0.02em; background: var(--tint); padding: 0.45rem 0.95rem; transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease; }
  .kit .chip:hover { background: var(--gold); color: var(--on-gold); transform: translateY(-2px); }

  /* Strengths */
  .strengths { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: 0; border-top: 2px solid var(--ink); }
  .strengths > div { padding: 1.6rem 1.6rem 1.6rem 0; border-bottom: 1px solid var(--line); min-width: 0; }
  .strengths h3 { font-size: 1.1rem; font-weight: 700; }
  .strengths p { margin-top: 0.6rem; color: var(--muted); font-size: 0.99rem; }
  .strengths .k { display: block; margin-bottom: 0.8rem; font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.1em; color: var(--clay); }

  /* Credentials */
  .creds { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr)); gap: 1rem; }
  .cred { background: var(--surface); border: 1.5px solid var(--line); border-radius: 1.2rem; padding: 1.3rem 1.4rem; display: grid; grid-template-columns: 2.6rem minmax(0, 1fr); gap: 1rem; align-items: start; min-width: 0; }
  .cred .seal { width: 2.6rem; height: 2.6rem; border-radius: 50%; background: var(--gold); color: var(--on-gold); display: grid; place-items: center; }
  .cred .seal svg { width: 1.3rem; height: 1.3rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .cred.win .seal { background: var(--clay); color: #fff; }
  .cred strong { display: block; font-weight: 600; line-height: 1.35; }
  .cred span { color: var(--muted); font-size: 0.93rem; }

  /* Contact */
  .contact { margin-top: clamp(3.5rem, 8vw, 6rem); background: var(--panel); color: var(--on-panel); border-radius: 1.8rem; overflow: hidden; }
  .contact-in { padding: clamp(1.6rem, 5vw, 3.8rem); display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: clamp(2rem, 5vw, 4rem); }
  .contact h2 { font-size: clamp(1.8rem, 1rem + 3.4vw, 3.4rem); font-weight: 900; line-height: 1.05; }
  .contact .label { color: color-mix(in srgb, var(--on-panel) 62%, transparent); }
  .contact p.sub { margin-top: 1.1rem; max-width: 30rem; color: color-mix(in srgb, var(--on-panel) 78%, transparent); }
  .rows { display: grid; gap: 1rem; align-content: center; min-width: 0; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0.8rem; padding-bottom: 1rem; border-bottom: 1px solid color-mix(in srgb, var(--on-panel) 20%, transparent); }
  .row:last-child { border-bottom: 0; padding-bottom: 0; }
  .row .k { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: color-mix(in srgb, var(--on-panel) 60%, transparent); }
  .row .v { font-weight: 500; font-size: 1.1rem; overflow-wrap: anywhere; user-select: all; }
  .copy { font: inherit; font-size: 0.82rem; font-weight: 600; cursor: pointer; background: transparent; color: var(--on-panel); border: 1.5px solid color-mix(in srgb, var(--on-panel) 45%, transparent); border-radius: 999px; padding: 0.4rem 0.9rem; }
  .copy:hover { border-color: var(--gold); color: var(--gold); }
  @media (max-width: 52rem) { .contact-in { grid-template-columns: minmax(0, 1fr); } }

  footer { padding-block: 2.2rem 2.8rem; display: flex; flex-wrap: wrap; gap: 0.5rem 2rem; justify-content: space-between; color: var(--muted); font-size: 0.9rem; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .track, .ring svg { animation: none; }
    .hl { animation: none; background-size: 100% 0.32em; }
    .btn, .card, .kit .chip { transition: none; }
  }

  

  .rendered .hl { animation: none; background-size: 100% 0.32em; }

  /* Contact form (shown on the hosted website) */
  .form { background: var(--surface); color: var(--ink); border-radius: 1.3rem; padding: clamp(1.2rem, 3vw, 2rem); display: grid; gap: 1rem; align-content: start; min-width: 0; }
  .form h3 { font-size: 1.2rem; font-weight: 700; }
  .field { display: grid; gap: 0.4rem; min-width: 0; }
  .field label { font-size: 0.85rem; font-weight: 600; }
  .field input, .field select, .field textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 0.7rem; padding: 0.7rem 0.9rem; width: 100%; min-width: 0; }
  .field textarea { resize: vertical; min-height: 7rem; }

  function kpiValue(d, k) {
    var vals = k.series === 1 ? d.series2 : d.line.values;
    var v;
    if (k.calc === 'sum') v = vals.reduce(function (a, b) { return a + b; }, 0);
    else if (k.calc === 'last') v = vals[vals.length - 1];
    else if (k.calc === 'min') v = Math.min.apply(null, vals);
    else if (k.calc === 'pctdrop') return Math.round((1 - vals[vals.length - 1] / vals[0]) * 100) + '%';
    else if (k.calc === 'pctgrow') return '+' + Math.round((vals[vals.length - 1] / vals[0] - 1) * 100) + '%';
    else if (k.calc === 'pts') { var dd = vals[vals.length - 1] - vals[0]; return (dd > 0 ? '+' : '') + dd + ' pts'; }
    return fmtNum(v, k.pre, k.suf);

  function niceStep(x) {
    var p = Math.pow(10, Math.floor(Math.log(x) / Math.LN10)), n = x / p;
    return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p;
  }
  var SVGNS = 'http://www.w3.org/2000/svg';
  function se(name, attrs, text) {
    var e = document.createElementNS(SVGNS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  function drawLine(el, d) {
    var L = d.line, vals = L.values, n = vals.length;
    var W = Math.max(260, el.clientWidth), H = 230, pad = { l: 40, r: 16, t: 14, b: 28 };
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    var lo = mn - (mx - mn) * 0.25, hi = mx + (mx - mn) * 0.15;
    var step = niceStep((hi - lo) / 4);
    var y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi / step) * step;
    var X = function (i) { return pad.l + (W - pad.l - pad.r) * (n === 1 ? 0.5 : i / (n - 1)); };
    var Y = function (v) { return pad.t + (H - pad.t - pad.b) * (1 - (v - y0) / (y1 - y0)); };
    var svg = se('svg', { 'class': 'ch', viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': L.title + '. Sample data.' });
    for (var t = y0; t <= y1 + 1e-9; t += step) {
      svg.appendChild(se('line', { 'class': 'gl', x1: pad.l, x2: W - pad.r, y1: Y(t), y2: Y(t) }));
      svg.appendChild(se('text', { 'class': 'tx', x: pad.l - 8, y: Y(t) + 4, 'text-anchor': 'end' }, fmtNum(t, '', '')));
    }
    var every = Math.ceil(n / Math.max(2, Math.floor((W - pad.l - pad.r) / 52)));
    L.labels.forEach(function (lb, i) {
      if (i % every === 0 || i === n - 1) svg.appendChild(se('text', { 'class': 'tx', x: X(i), y: H - 8, 'text-anchor': i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle' }, lb));
    });
    svg.appendChild(se('path', { 'class': 'd-line', d: vals.map(function (v, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); }).join(' ') }));
    svg.appendChild(se('circle', { 'class': 'd-dot', cx: X(n - 1), cy: Y(vals[n - 1]), r: 4.5 }));
    var cross = se('line', { 'class': 'd-cross', y1: pad.t, y2: H - pad.b, opacity: 0 });
    var hov = se('circle', { 'class': 'd-dot', r: 5, opacity: 0 });
    svg.appendChild(cross); svg.appendChild(hov);
    var hit = se('rect', { x: pad.l, y: 0, width: W - pad.l - pad.r, height: H, fill: 'transparent' });
    svg.appendChild(hit);
    el.appendChild(svg);
    var tip = document.createElement('div'); tip.className = 'd-tip'; el.appendChild(tip);
    function move(ev) {
      var r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) * (W / r.width);
      var i = Math.max(0, Math.min(n - 1, Math.round((x - pad.l) / ((W - pad.l - pad.r) / (n - 1)))));
      cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.setAttribute('opacity', 1);
      hov.setAttribute('cx', X(i)); hov.setAttribute('cy', Y(vals[i])); hov.setAttribute('opacity', 1);
      tip.textContent = L.labels[i] + ': ' + fmtNum(vals[i], L.pre, L.suf);
      tip.style.left = Math.max(60, Math.min(W - 60, X(i))) + 'px'; tip.style.top = Y(vals[i]) + 'px'; tip.className = 'd-tip on';
    }
    function leave() { cross.setAttribute('opacity', 0); hov.setAttribute('opacity', 0); tip.className = 'd-tip'; }
    hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move); hit.addEventListener('pointerleave', leave);
  }
  function drawBars(el, d) {
    var B = d.bars, items = B.items, n = items.length;
    var W = Math.max(260, el.clientWidth), rowH = 36, H = n * rowH + 6;
    var labW = Math.min(112, Math.round(W * 0.34)), right = 48;
    var mx = Math.max.apply(null, items.map(function (x) { return x[1]; }));
    var scale = (W - labW - right) / mx;
    var svg = se('svg', { 'class': 'ch', viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': B.title + '. Sample data.' });
    var tip = document.createElement('div'); tip.className = 'd-tip';
    items.forEach(function (it, i) {
      var y = 3 + i * rowH, h = 20, w = Math.max(6, it[1] * scale), r = 4, x0 = labW;
      svg.appendChild(se('text', { 'class': 'rl', x: 0, y: y + h / 2 + 4 }, it[0]));
      var path = 'M' + x0 + ' ' + y + 'h' + (w - r) + 'a' + r + ' ' + r + ' 0 0 1 ' + r + ' ' + r + 'v' + (h - 2 * r) + 'a' + r + ' ' + r + ' 0 0 1 -' + r + ' ' + r + 'h-' + (w - r) + 'z';
      var bar = se('path', { 'class': 'd-bar', d: path });
      svg.appendChild(bar);
      svg.appendChild(se('text', { 'class': 'vl', x: x0 + w + 8, y: y + h / 2 + 4 }, fmtNum(it[1], '', B.suf)));
      var hit = se('rect', { x: 0, y: y - 6, width: W, height: rowH, fill: 'transparent' });
      var show = function () {
        tip.textContent = it[0] + ': ' + fmtNum(it[1], '', B.suf);
        tip.style.left = Math.min(W - 60, Math.max(60, x0 + w / 2)) + 'px'; tip.style.top = y + 'px'; tip.className = 'd-tip on';
      };
      hit.addEventListener('pointerenter', show); hit.addEventListener('pointerdown', show);
      hit.addEventListener('pointerleave', function () { tip.className = 'd-tip'; });
      svg.appendChild(hit);
    });
    el.appendChild(svg); el.appendChild(tip);
  }

  var initSignal = function () {
/* Signal strip: scattered records settle into a chart */
  (function () {
    var cv = document.getElementById('signal');
    if (!cv || !cv.getContext) return;
    var ctx = cv.getContext('2d');
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var BARS = [0.24, 0.33, 0.29, 0.45, 0.52, 0.48, 0.66, 0.79, 0.94];
    var W = 0, H = 0, dpr = 1, P = [], C = {}, raf = 0, visible = true, geo = null;

    function readColors() {
      var s = getComputedStyle(document.documentElement);
      var g = function (n) { return s.getPropertyValue(n).trim(); };
      C = { brand: g('--brand'), gold: g('--gold'), clay: g('--clay'), muted: g('--muted'), line: g('--line'), ink: g('--ink') };
    }
    function rnd(a, b) { return a + Math.random() * (b - a); }
    function ease(t) { t = Math.max(0, Math.min(1, t)); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

    function build() {
      var r = cv.getBoundingClientRect();
      W = Math.max(280, r.width); H = r.height;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var n = Math.round(Math.min(260, Math.max(110, W / 4.2)));
      var padX = W * 0.07, top = H * 0.2, base = H * 0.86;
      var slot = (W - 2 * padX) / BARS.length, bw = slot * 0.62;
      var sum = BARS.reduce(function (a, b) { return a + b; }, 0);
      geo = { padX: padX, base: base, slot: slot, bw: bw, tops: [] };
      P = [];
      BARS.forEach(function (h, b) {
        var cnt = Math.max(5, Math.round(n * h / sum));
        var bh = (base - top) * h, bx = padX + b * slot + (slot - bw) / 2;
        geo.tops.push({ x: bx + bw / 2, y: base - bh });
        for (var i = 0; i < cnt; i++) {
          P.push({
            tx: bx + rnd(2, bw - 2), ty: base - rnd(2, bh),
            cx: rnd(0.03 * W, 0.97 * W), cy: rnd(0.14 * H, 0.9 * H),
            ax: rnd(6, 22), ay: rnd(6, 20), sp: rnd(0.4, 1.1), ph: rnd(0, 6.28),
            r: rnd(1.6, 2.9), last: b === BARS.length - 1, bar: b
          });
        }
      });
    }

    function frame(t) {
      var T = 12, s = ((t / 1000) % T) / T;
      var k = s < 0.18 ? 0 : s < 0.48 ? ease((s - 0.18) / 0.3) : s < 0.86 ? 1 : 1 - ease((s - 0.86) / 0.14);
      var lp = Math.max(0, Math.min(1, (s - 0.5) / 0.22));
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = C.line; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(geo.padX * 0.6, geo.base + 8); ctx.lineTo(W - geo.padX * 0.6, geo.base + 8); ctx.stroke();
      var sec = t / 1000;
      for (var i = 0; i < P.length; i++) {
        var p = P[i];
        var x0 = p.cx + Math.sin(sec * p.sp + p.ph) * p.ax;
        var y0 = p.cy + Math.cos(sec * p.sp * 0.9 + p.ph) * p.ay;
        var x = x0 + (p.tx - x0) * k, y = y0 + (p.ty - y0) * k;
        ctx.globalAlpha = k > 0.55 ? 0.95 : 0.55;
        ctx.fillStyle = k > 0.55 ? (p.last ? C.gold : C.brand) : C.muted;
        ctx.beginPath(); ctx.arc(x, y, p.r, 0, 6.2832); ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (lp > 0 && k > 0.9) {
        var pts = geo.tops, segs = pts.length - 1, upto = lp * segs;
        ctx.strokeStyle = C.clay; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y - 14);
        for (var j = 1; j <= segs; j++) {
          if (upto >= j) { ctx.lineTo(pts[j].x, pts[j].y - 14); }
          else { var f = upto - (j - 1); if (f > 0) ctx.lineTo(pts[j - 1].x + (pts[j].x - pts[j - 1].x) * f, pts[j - 1].y - 14 + (pts[j].y - pts[j - 1].y) * f); break; }
        }
        ctx.stroke();
        if (lp >= 0.98) { ctx.fillStyle = C.clay; ctx.beginPath(); ctx.arc(pts[segs].x, pts[segs].y - 14, 5, 0, 6.2832); ctx.fill(); }
      }
    }

    var OFFSET = 0.66 * 12000, t0 = performance.now();
    function loop(t) { frame(t - t0 + OFFSET); raf = (visible && !document.hidden) ? requestAnimationFrame(loop) : 0; }
    function start() { if (!raf && !reduce) raf = requestAnimationFrame(loop); }
    function still() { frame(OFFSET); }

    function setup() { readColors(); build(); still(); }
    setup();
    if (!reduce) start();

    var rt;
    window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(setup, 150); });
    window.addEventListener('themechange', function () { readColors(); if (reduce) still(); });
    try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { readColors(); if (reduce) still(); }); } catch (e) {}
    document.addEventListener('visibilitychange', start);
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (en) { visible = en[0].isIntersecting; if (visible) start(); }, { threshold: 0 }).observe(cv);
    }
  })();
  };
  render();
  setTimeout(function () { document.documentElement.classList.add('rendered'); }, 1900);


})();
